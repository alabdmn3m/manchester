<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مراجعة صور الدليل</title>
<style>
:root{--bg:#F4F2F9;--card:#fff;--ink:#1B1530;--mut:#5C5670;--acc:#4B2A8C;--line:#E2DDEE}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14101F;--card:#1E1830;--ink:#F1EEF8;--mut:#B3ACC6;--acc:#C9B3FF;--line:#2E2745}}
:root[data-theme=dark]{--bg:#14101F;--card:#1E1830;--ink:#F1EEF8;--mut:#B3ACC6;--acc:#C9B3FF;--line:#2E2745}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
main{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 6px} p.lead{color:var(--mut);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
figure img,.err{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--line)}
.err{display:grid;place-items:center;color:var(--mut)}
.n{position:absolute;top:10px;right:10px;background:var(--acc);color:#fff;font-weight:700;border-radius:999px;min-width:34px;height:34px;display:grid;place-items:center;font-size:1.05rem}
figcaption{padding:10px 14px 14px;display:grid;gap:2px} figcaption span{color:var(--mut)} figcaption small{color:var(--mut);direction:ltr;text-align:right}
</style></head><body><main><h1>مراجعة صور الدليل قبل نشرها</h1>
